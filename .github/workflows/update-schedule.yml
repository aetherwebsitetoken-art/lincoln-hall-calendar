name: Update Lincoln Hall schedule

on:
  schedule:
    # Runs at 11:00, 15:00, and 20:00 UTC every day (roughly 6am, 10am, 3pm
    # Central). Edit these however often you want fresh data -- QuickScores
    # is a small conference site, so a few times a day is plenty polite.
    - cron: "0 11,15,20 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually any time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python3 scrape_schedule.py

      - name: Commit updated events.json (if it changed)
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto-update schedule" && git push)
