name: Update Lincoln Hall schedule

on:
  schedule:
    - cron: "0 11,15,20 * * *"
  workflow_dispatch: {}   

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4 playwright

      - name: Install headless browser
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python3 scrape_schedule.py

      - name: Commit updated events.json (if it changed)
        id: commit
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git commit -m "Auto-update schedule"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          REPO="${GITHUB_REPOSITORY}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/events.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/index.html" || true
