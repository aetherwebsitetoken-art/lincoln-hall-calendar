<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lincoln Hall Sports Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Google Sites Reset and Base Styles */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent body scroll, handle scroll internally */
            box-sizing: border-box;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Custom Scrollbar for the modal and calendar body if needed */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e5e7eb; /* Tailwind gray-200 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9ca3af; /* Tailwind gray-400 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; /* Tailwind gray-600 */
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Calendar Grid Overrides */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-auto-rows: minmax(110px, 1fr); /* Increased min-height to 110px for excellent iPad tap targets */
            gap: 1px;
            background-color: #e5e7eb; /* Grid line color (gray-200) */
            height: 100%;
        }

        .calendar-cell {
            background-color: #ffffff;
            transition: background-color 0.15s ease;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 8px; /* Enhanced touch padding */
        }

        .calendar-cell:hover {
            background-color: #f9fafb; /* gray-50 */
        }
        
        .calendar-cell.has-events:hover {
            background-color: #fef2f2; /* red-50 */
        }

        .calendar-cell.empty {
            background-color: #f9fafb;
            cursor: default;
        }
        
        /* Hide scrollbar for internal elements but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

            };

            // --- DOM Elements ---
            const gridEl = document.getElementById('calendar-grid');
            const monthYearEl = document.getElementById('current-month-year');
            const prevBtn = document.getElementById('prev-month');
            const nextBtn = document.getElementById('next-month');
            
            const modalEl = document.getElementById('event-modal');
            const modalDateTitle = document.getElementById('modal-date-title');
            const modalEventsList = document.getElementById('modal-events-list');
            const closeBtn = document.getElementById('close-modal');
            const closeBtnFooter = document.getElementById('close-modal-btn');

            // --- STREAMING_CHUNK: Calendar Rendering Logic ---
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            function formatZeroPad(num) {
                return num < 10 ? '0' + num : num;
            }

            function getFormatDateKey(year, month, day) {
                return `${year}-${formatZeroPad(month + 1)}-${formatZeroPad(day)}`;
            }

            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                // Update Header Text
                monthYearEl.textContent = `${monthNames[month]} ${year}`;
                
                // Clear grid
                gridEl.innerHTML = '';
                
                // Calculations for grid
                const firstDay = new Date(year, month, 1).getDay(); // 0 (Sun) to 6 (Sat)
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                // Render empty padding cells for previous month
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'calendar-cell empty';
                    gridEl.appendChild(emptyCell);
                }
                
                // Render actual days
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = getFormatDateKey(year, month, day);
                    const dayEvents = eventsData[dateKey] || [];
                    
                    const cell = document.createElement('div');
                    cell.className = `calendar-cell p-2 border-b border-r border-gray-200 relative ${dayEvents.length > 0 ? 'has-events' : ''}`;
                    
                    // Day Number
                    const dayNum = document.createElement('span');
                    dayNum.className = 'text-sm font-semibold text-gray-700 mb-1';
                    dayNum.textContent = day;
                    
                    // Container for event indicators
                    const eventsContainer = document.createElement('div');
                    eventsContainer.className = 'flex flex-col gap-1.5 mt-1 overflow-y-auto w-full no-scrollbar';
                    
                    // Add event markers if data exists
                    if (dayEvents.length > 0) {
                        // Mobile dot representation (hidden on iPad/Desktop)
                        const dotContainer = document.createElement('div');
                        dotContainer.className = 'sm:hidden absolute bottom-1.5 left-1/2 transform -translate-x-1/2 flex gap-1.5';
                        
                        // Render up to 4 pills for iPad/Desktop
                        const displayLimit = 4;
                        
                        for (let i = 0; i < Math.min(dayEvents.length, displayLimit); i++) {
                            const ev = dayEvents[i];
                            
                            // Extract time for the pill
                            const timeRaw = ev.time || '';
                            // Shorten time (e.g. 4:00 PM -> 4p)
                            const timeShort = timeRaw.replace(':00', '').replace(' PM', 'p').replace(' AM', 'a');
                            
                            // Desktop/Tablet Pill (iPad friendly)
                            const pill = document.createElement('div');
                            pill.className = `hidden sm:block text-[11px] md:text-xs px-1.5 py-1 rounded-md truncate font-medium text-white shadow-sm ${ev.type === 'soccer' ? 'bg-slate-800' : 'bg-red-600'}`;
                            
                            // Abbreviate sport names for space
                            const shortSport = ev.sport.replace('Boys Varsity', 'B. Var')
                                                       .replace('Boys JV', 'B. JV')
                                                       .replace('Girls Varsity', 'G. Var')
                                                       .replace('Girls JV', 'G. JV');
                                                       
                            pill.textContent = `${timeShort} ${shortSport}`;
                            eventsContainer.appendChild(pill);
                            
                            // Mobile Dot (only 3 dots max shown clearly on small screens)
                            if (i < 3) {
                                const dot = document.createElement('div');
                                dot.className = `w-1.5 h-1.5 rounded-full ${ev.type === 'soccer' ? 'bg-slate-800' : 'bg-red-600'}`;
                                dotContainer.appendChild(dot);
                            }
                        }
                        
                        if (dayEvents.length > displayLimit) {
                            const extra = document.createElement('div');
                            extra.className = 'hidden sm:block text-[11px] text-gray-500 font-bold ml-1 mt-0.5';
                            extra.textContent = `+${dayEvents.length - displayLimit} more`;
                            eventsContainer.appendChild(extra);
                        }
                        
                        if (dayEvents.length > 3) {
                            const dotExtra = document.createElement('div');
                            dotExtra.className = 'sm:hidden w-1.5 h-1.5 rounded-full bg-gray-400';
                            dotContainer.appendChild(dotExtra);
                        }

                        cell.appendChild(dotContainer);
                        
                        // Add Click Handler for Modal
                        cell.addEventListener('click', () => openModal(year, month, day, dayEvents));
                    }
                    
                    cell.appendChild(dayNum);
                    cell.appendChild(eventsContainer);
                    
                    gridEl.appendChild(cell);
                }
            }

            // --- STREAMING_CHUNK: Modal Logic and Event Renderers ---
            function openModal(year, month, day, eventsList) {
                // Set Title
                const formattedDate = new Date(year, month, day).toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
                modalDateTitle.textContent = formattedDate;
                
                // Clear previous events
                modalEventsList.innerHTML = '';
                
                // Build event cards
                eventsList.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'bg-white border-l-4 rounded-lg shadow-sm p-4 relative flex flex-col sm:flex-row gap-4 sm:items-center ' + (ev.type === 'soccer' ? 'border-black' : 'border-red-600');
                    
                    // Icon
                    const iconWrap = document.createElement('div');
                    iconWrap.className = `hidden sm:flex flex-shrink-0 w-12 h-12 rounded-full items-center justify-center text-2xl ${ev.type === 'soccer' ? 'bg-gray-100 text-gray-800' : 'bg-red-50 text-red-600'}`;
                    iconWrap.innerHTML = ev.type === 'soccer' ? '⚽' : '🏐';
                    
                    // Content
                    const content = document.createElement('div');
                    content.className = 'flex-grow';
                    
                    // Sport Label
                    const sportLabel = document.createElement('span');
                    sportLabel.className = `text-xs font-bold uppercase tracking-wider ${ev.type === 'soccer' ? 'text-gray-600' : 'text-red-600'}`;
                    sportLabel.textContent = ev.sport;
                    
                    // Matchup
                    const matchup = document.createElement('h4');
                    matchup.className = 'text-lg font-bold text-gray-900 mt-1';
                    matchup.textContent = ev.match;
                    
                    // Details Container (Grid for neatness)
                    const detailsGrid = document.createElement('div');
                    detailsGrid.className = 'mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-gray-600';
                    
                    // Detail: Location
                    if (ev.loc) {
                        const locDiv = document.createElement('div');
                        locDiv.className = 'flex items-center gap-1.5';
                        locDiv.innerHTML = `<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg><span class="font-medium text-black">Location:</span> ${ev.loc}`;
                        detailsGrid.appendChild(locDiv);
                    }

                    // Detail: Time
                    if (ev.time) {
                        const timeDiv = document.createElement('div');
                        timeDiv.className = 'flex items-center gap-1.5';
                        timeDiv.innerHTML = `<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span class="font-medium text-black">Time:</span> ${ev.time}`;
                        detailsGrid.appendChild(timeDiv);
                    }
                    
                    // Detail: Score/Note
                    if (ev.note) {
                        const noteDiv = document.createElement('div');
                        noteDiv.className = 'flex items-center gap-1.5';
                        noteDiv.innerHTML = `<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span class="font-medium text-black">Note/Score:</span> <span class="bg-gray-100 px-2 py-0.5 rounded text-gray-800">${ev.note}</span>`;
                        detailsGrid.appendChild(noteDiv);
                    }
                    
                    // Detail: Referee
                    if (ev.ref) {
                        const refDiv = document.createElement('div');
                        refDiv.className = 'flex items-center gap-1.5';
                        refDiv.innerHTML = `<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="font-medium text-black">Official:</span> ${ev.ref}`;
                        detailsGrid.appendChild(refDiv);
                    }
                    
                    content.appendChild(sportLabel);
                    content.appendChild(matchup);
                    content.appendChild(detailsGrid);
                    
                    card.appendChild(iconWrap);
                    card.appendChild(content);
                    
                    modalEventsList.appendChild(card);
                });
                
                // Show modal
                modalEl.classList.remove('hidden');
            }

            function closeModal() {
                modalEl.classList.add('hidden');
            }

            // --- STREAMING_CHUNK: Event Listeners & Bootstrapping ---
            
            // Month navigation
            prevBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });
            
            nextBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });
            
            // Close modal handlers
            closeBtn.addEventListener('click', closeModal);
            closeBtnFooter.addEventListener('click', closeModal);
            modalEl.addEventListener('click', (e) => {
                if (e.target === modalEl) closeModal();
            });

            // Handle Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modalEl.classList.contains('hidden')) {
                    closeModal();
                }
            });

            // --- Live data loading ---
            // events.json is written by scrape_schedule.py (run automatically
            // by a GitHub Action every few hours). It lives right next to this
            // HTML file, so this fetch is same-origin -- the browser never
            // contacts quickscores.com directly, which is what lets this work
            // even on networks that block that site.
            const syncStatusEl = document.getElementById('sync-status');

            function formatSyncTime(iso) {
                try {
                    const d = new Date(iso);
                    return d.toLocaleString('en-US', {
                        month: 'short', day: 'numeric',
                        hour: 'numeric', minute: '2-digit'
                    });
                } catch (e) {
                    return null;
                }
            }

            async function loadEvents() {
                try {
                    // cache: 'no-store' so a visitor always gets the latest
                    // file rather than a stale cached copy of events.json
                    const res = await fetch('events.json', { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!data || typeof data.events !== 'object') {
                        throw new Error('Unexpected events.json shape');
                    }
                    eventsData = data.events;
                    const when = formatSyncTime(data.generated_at);
                    syncStatusEl.textContent = when ? `Updated ${when}` : 'Live schedule loaded';
                } catch (err) {
                    console.warn('Could not load events.json, showing built-in fallback schedule:', err);
                    syncStatusEl.textContent = 'Showing saved schedule (live update unavailable)';
                }
                renderCalendar();
            }

            // Initial Render
            loadEvents();
            
        });
    </script>
</body>
</html>
