<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lincolnwood SD74 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --font:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --bg:#1c1c1f;        /* charcoal background */
    --panel:#25252a;     /* panels / cards */
    --panel-2:#2e2e34;   /* inner areas */
    --line:#3b3b42;      /* borders */
    --red:#d42a3c;       /* accent */
    --red-dark:#9c1426;  /* button shadows */
    --ink:#f5f5f3;       /* text */
    --muted:#a8a8b1;     /* secondary text */
    --c:var(--red);      /* per-event accent, set by the script */
    --ease:cubic-bezier(.22,.8,.26,1);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit}
  button,.cell,.chip,.card{-webkit-tap-highlight-color:transparent}
  button:focus-visible,.cell:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

  .page{display:flex;flex-direction:column;width:100%;height:100%;
    opacity:0;animation:fade .4s var(--ease) forwards}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Header ---------- */
  .top{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line)}
  .top-in{max-width:1600px;margin:0 auto;width:100%;padding:11px 16px;
    display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .mark{width:38px;height:38px;border-radius:7px;flex-shrink:0;
    background:repeating-linear-gradient(135deg,var(--red) 0 7px,var(--panel-2) 7px 14px);
    border:1px solid var(--line);transition:transform .3s var(--ease)}
  .brand:hover .mark{transform:rotate(8deg) scale(1.05)}
  .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
  .brand p{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:500}

  .nav{display:flex;align-items:center;gap:9px;margin-left:auto}
  .nav button.arrow{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--bg);
    transition:background .15s,transform .08s linear,box-shadow .08s linear}
  .nav button.arrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bg)}
  .mlabel{text-align:center;min-width:176px;flex-shrink:0}
  .mlabel h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;display:inline-block}
  .mlabel h2.flip{animation:flip .32s var(--ease)}
  @keyframes flip{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
  .status{font-size:10px;color:var(--muted);margin:2px 0 0;min-height:12px;font-weight:500}
  .today-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;
    font-size:12px;font-weight:700;padding:9px 14px;border-radius:7px;white-space:nowrap;flex-shrink:0;
    box-shadow:0 3px 0 var(--bg);transition:background .15s,color .15s,transform .08s linear,box-shadow .08s linear}
  .today-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bg)}

  .views{display:flex;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:3px;gap:3px;flex-shrink:0}
  .views button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
    font-weight:700;padding:7px 15px;border-radius:6px;transition:background .18s,color .18s}
  .views button.on{background:var(--red);color:var(--ink);box-shadow:0 3px 0 var(--red-dark)}

  /* ---------- Next-up strip ---------- */
  .strip{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--line)}
  .strip-in{max-width:1600px;margin:0 auto;width:100%;padding:10px 16px;
    display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
  .next{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;flex:1;min-width:0}
  .next .lab{font-size:12px;color:var(--muted);font-weight:600;flex-shrink:0}
  .next .dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;align-self:center}
  .next .m{font-weight:700;font-size:14px}
  .next .d{font-size:13px;color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    font-size:12px;font-weight:700;padding:7px 13px;border-radius:7px;cursor:pointer;
    box-shadow:0 3px 0 var(--bg);transition:background .15s,color .15s,transform .08s linear,box-shadow .08s linear}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bg)}
  .chip.on{background:var(--red);border-color:var(--red);color:var(--ink);box-shadow:0 3px 0 var(--red-dark)}
  .chip.on:active{box-shadow:0 1px 0 var(--red-dark)}
  .chip.on.district{background:var(--panel-2);border-color:var(--muted);color:var(--ink);
    box-shadow:0 3px 0 var(--bg)}

  main{flex:1;min-height:0;width:100%;position:relative}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;
    transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .panel.on{opacity:1;pointer-events:auto;transform:none}
  .wrap{max-width:1600px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column}

  /* ---------- Month grid ---------- */
  .dow{display:grid;grid-template-columns:minmax(0,.62fr) repeat(5,minmax(0,1fr)) minmax(0,.62fr);
    flex-shrink:0;padding:10px 12px 6px}
  .dow div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:1.1px}
  .grid{display:grid;grid-template-columns:minmax(0,.62fr) repeat(5,minmax(0,1fr)) minmax(0,.62fr);
    grid-auto-rows:minmax(96px,1fr);gap:7px;flex:1;overflow-y:auto;padding:0 12px 14px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
    transition:transform .18s var(--ease),background .18s,border-color .18s;
    opacity:0;animation:rise .3s var(--ease) forwards}
  .cell.has{cursor:pointer}
  .cell.pad{background:transparent;border-style:dashed}
  .cell.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .num{font-size:clamp(12.5px,.85vw,14px);font-weight:700;color:var(--muted);width:24px;height:24px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:5px;margin-bottom:4px}
  .cell.today .num{background:var(--red);color:var(--ink)}
  .pills{display:flex;flex-direction:column;gap:3px;overflow:hidden;flex:1}
  .pill{font-size:clamp(10.5px,.78vw,12.5px);line-height:1.3;padding:3px 6px;border-radius:5px;
    background:var(--panel-2);border-left:3px solid var(--c);color:var(--ink);
    overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;flex-shrink:0;transition:background .15s}
  .pill.status{color:var(--muted);font-weight:700}
  .more{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:4px}
  .dots{display:flex;gap:4px;margin-top:auto;padding-top:3px}
  .dots i{width:8px;height:8px;border-radius:2px;background:var(--c)}

  /* ---------- Agenda ---------- */
  .agenda{flex:1;overflow-y:auto;padding:16px 16px 48px}
  .grp{margin-bottom:20px}
  .grp.past{opacity:.5}
  .grp h3{font-size:13px;font-weight:700;margin:0 0 9px;padding-bottom:7px;
    border-bottom:1px solid var(--line);color:var(--muted)}
  .divider{display:flex;align-items:center;gap:10px;margin:6px 0 22px;color:var(--red)}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .divider span{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .card{display:flex;gap:13px;padding:13px 15px;margin-bottom:8px;background:var(--panel);
    border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;
    opacity:0;transform:translateX(-5px);animation:cardin .3s var(--ease) forwards;
    transition:background .18s,transform .18s}
  @keyframes cardin{to{opacity:1;transform:none}}
  .card .ico{font-size:21px;flex-shrink:0;line-height:1.3}
  .card .bd{flex:1;min-width:0}
  .card .sp{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
  .card .mt{font-size:15.5px;font-weight:700;margin:3px 0 5px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 15px;font-size:12.5px;color:var(--muted)}
  .meta strong{color:var(--ink);font-weight:600}
  .note{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--line);padding:3px 9px;border-radius:5px;color:var(--ink)}
  .empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}
  .retry{margin-top:16px;background:var(--red);color:var(--ink);border:1px solid var(--red);
    padding:11px 20px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;
    box-shadow:0 4px 0 var(--red-dark);transition:transform .08s linear,box-shadow .08s linear}
  .retry:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark)}

  /* ---------- Day dialog ---------- */
  .back{position:fixed;inset:0;z-index:50;background:rgba(28,28,31,.88);display:none;
    align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}
  .back.on{display:flex;opacity:1}
  .box{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    transform:scale(.96) translateY(8px);opacity:0;
    transition:transform .26s var(--ease),opacity .26s var(--ease)}
  .back.on .box{transform:none;opacity:1}
  .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;
    border-bottom:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px 10px 0 0}
  .hd h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
  .x{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink);cursor:pointer;font-size:15px;flex-shrink:0;transition:background .15s}
  .bdy{padding:16px;overflow-y:auto;flex:1;background:var(--bg)}
  .bdy .card{margin-bottom:9px}
  .ft{padding:13px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
  .close{background:var(--red);border:1px solid var(--red);color:var(--ink);padding:10px 22px;
    border-radius:7px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 4px 0 var(--red-dark);
    transition:transform .08s linear,box-shadow .08s linear}
  .close:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark)}

  @media (hover:hover){
    .cell.has:hover{background:var(--panel-2);border-color:var(--muted);transform:translateY(-2px);z-index:2}
    .card:hover{background:var(--panel-2);transform:translateX(3px)}
    .nav button.arrow:hover,.today-btn:hover,.x:hover,.chip:hover{background:var(--line);color:var(--ink)}
    .chip.on:hover,.retry:hover,.close:hover{background:var(--red)}
    .views button:not(.on):hover{color:var(--ink);background:var(--line)}
  }

  @media (max-width:640px){
    .top-in{padding:9px 12px;gap:8px 10px}
    .brand p{display:none}
    .brand h1{font-size:16px}
    .mark{width:32px;height:32px}
    .views{order:2;margin-left:auto}
    .views button{padding:7px 12px}
    .nav{order:3;width:100%;margin-left:0}
    .mlabel{min-width:0;flex:1}
    .mlabel h2{font-size:15px}
    .nav button.arrow{width:40px;height:40px;font-size:20px}
    .today-btn{padding:9px 13px}
    .strip-in{padding:9px 12px;gap:8px;flex-wrap:nowrap}
    .next{flex-wrap:nowrap;overflow:hidden}
    .next .d{display:none}
    .next .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .chip{padding:7px 11px}
    .dow{padding:8px 8px 5px}
    .grid{grid-auto-rows:minmax(66px,1fr);gap:5px;padding:0 8px 12px}
    .cell{padding:6px;border-radius:7px}
    .pill,.more{display:none}
    .dots{display:flex;gap:4px}
    .agenda{padding:14px 12px 40px}
  }
  @media (min-width:641px){.dots{display:none}}
  @media (max-height:500px) and (orientation:landscape){
    .top-in{padding:6px 14px}
    .brand p{display:none}
    .mark{width:30px;height:30px}
    .strip-in{padding:6px 14px}
    .next .d{display:none}
    .dow{padding:6px 10px 4px}
    .grid{grid-auto-rows:minmax(84px,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .page,.cell,.card{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div><h1>Lincolnwood SD74</h1><p>Sports &amp; School Events</p></div>
      </div>
      <div class="nav">
        <button id="prev" class="arrow" aria-label="Previous month">‹</button>
        <div class="mlabel"><h2 id="month"></h2><p class="status" id="status">&nbsp;</p></div>
        <button id="next" class="arrow" aria-label="Next month">›</button>
        <button class="today-btn" id="todayBtn">Today</button>
      </div>
      <div class="views" role="tablist" aria-label="View">
        <button id="vMonth" class="on" role="tab" aria-selected="true">Month</button>
        <button id="vAgenda" role="tab" aria-selected="false">Agenda</button>
      </div>
    </div>
  </header>

  <section class="strip">
    <div class="strip-in">
      <div class="next" id="next-up"><span class="lab">Loading schedule…</span></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <main>
    <div class="panel on" id="pMonth">
      <div class="wrap">
        <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="panel" id="pAgenda"><div class="wrap"><div class="agenda" id="agenda"></div></div></div>
  </main>
</div>

<div class="back" id="modal">
  <div class="box">
    <div class="hd"><h3 id="mTitle"></h3><button class="x" id="mX" aria-label="Close">✕</button></div>
    <div class="bdy" id="mBody"></div>
    <div class="ft"><button class="close" id="mClose">Close</button></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  // ─────────────────────────────────────────────────────────────────
  // TEMPLATE. Don't paste this file into Google Sites -- paste embed.html
  // from the repository, which the updater builds from this template.
  // WHERE THE LIVE SCHEDULE COMES FROM
  //
  // Leave as 'events.json' if this file is hosted as its own page
  // (GitHub Pages / jsDelivr / Firebase).
  //
  // If you PASTE this whole file into Google Sites (Insert → Embed →
  // Embed code), change it to the full jsDelivr URL, e.g.
  // 'https://cdn.jsdelivr.net/gh/YOUR-USERNAME/lincoln-hall-calendar@main/events.json'
  // ─────────────────────────────────────────────────────────────────
  const EVENTS_JSON_URL = /*URL_START*/'events.json'/*URL_END*/;

  // Sport styling. Palette is strictly red / white / black; sports
  // alternate red vs black accents, with the icon carrying the rest.
  const SPORTS = {
    soccer:     {c:'var(--ink)', i:'⚽', label:'Soccer'},
    volleyball: {c:'var(--red)', i:'🏐', label:'Volleyball'},
    basketball: {c:'var(--ink)', i:'🏀', label:'Basketball'},
    other:      {c:'var(--red)', i:'🏅', label:'Other'},
    // District-wide calendar entries
    // District-side entries use a neutral grey so they read as clearly
    // separate from athletics, which are red and white. (On this dark
    // background a literal black would be invisible.)
    district:   {c:'var(--muted)', i:'📅', label:'District Event'},
    noschool:   {c:'var(--muted)', i:'🚫', label:'No School'},
    halfday:    {c:'var(--muted)', i:'🕧', label:'Half Day'},
    school:     {c:'var(--muted)', i:'🏫', label:'School Day'}
  };
  const meta = t => SPORTS[t] || SPORTS.other;

  // Filter chips group by category rather than by individual type, so the
  // row stays short as more sports and event kinds appear.
  const CATS = {
    sports:   {i:'🏆', label:'Sports'},
    district: {i:'📅', label:'District'}
  };
  // Half days and no-school days sit under District alongside ordinary
  // district events. Listed explicitly so an event that arrives without a
  // category still lands in the right bucket.
  const DISTRICT_TYPES = ['district','noschool','halfday','school'];
  // Trust the stored category only if it's one the page knows about;
  // otherwise derive it from the event type, so stale data can't hide events.
  const catOf = e => (e.cat && CATS[e.cat]) ? e.cat
    : (DISTRICT_TYPES.includes(e.type) ? 'district' : 'sports');

  // Offline fallback: real Fall 2026 games, used only if the live fetch
  // fails so the page is never blank. Status line says which is showing.
  const FALLBACK = /*FALLBACK_START*/{
    "2026-09-08":[{sport:"Girls Varsity Volleyball",match:"Lincoln Hall vs Park View",loc:"Niles West",time:"4:15 PM",note:"2-0 (Win)",ref:"Moy",type:"volleyball"},
                  {sport:"Boys JV Soccer",match:"Golf vs Lincoln Hall",loc:"Golf",time:"4:00 PM",note:"4-0 (Win)",ref:"",type:"soccer"}],
    "2026-09-09":[{sport:"Boys Varsity Soccer",match:"Fairview vs Lincoln Hall",loc:"Fairview",time:"4:00 PM",note:"5-3 (Win)",ref:"",type:"soccer"}],
    "2026-09-10":[{sport:"Girls Varsity Volleyball",match:"Lincoln Hall vs Golf",loc:"Lincoln Hall",time:"4:00 PM",note:"2-1 (Win)",ref:"Moy",type:"volleyball"}],
    "2026-09-11":[{sport:"Boys Varsity Soccer",match:"Lincoln vs Lincoln Hall",loc:"Lincoln",time:"4:15 PM",note:"5-1 (Win)",ref:"",type:"soccer"}],
    "2026-09-17":[{sport:"Boys Varsity Soccer",match:"Park View vs Lincoln Hall",loc:"Park View",time:"4:00 PM",note:"",ref:"",type:"soccer"},
                  {sport:"Girls Varsity Volleyball",match:"Lincoln Hall vs East Prairie",loc:"Lincoln Hall",time:"4:15 PM",note:"",ref:"Moy",type:"volleyball"}],
    "2026-09-22":[{sport:"Girls Varsity Volleyball",match:"Lincoln Hall vs Old Orchard",loc:"Lincoln Hall",time:"4:15 PM",note:"",ref:"Moy",type:"volleyball"}],
    "2026-09-25":[{sport:"Boys Varsity Soccer",match:"Lincoln Hall vs McCracken",loc:"Lincoln Hall",time:"4:00 PM",note:"",ref:"",type:"soccer"}],
    "2026-09-29":[{sport:"Boys Varsity Soccer",match:"Lincoln Hall vs Golf",loc:"Lincoln Hall",time:"4:00 PM",note:"",ref:"",type:"soccer"}],
    "2026-10-05":[{sport:"Girls Varsity Volleyball",match:"Park View vs Lincoln Hall",loc:"Park View",time:"5:00 PM",note:"",ref:"",type:"volleyball"}],
    "2026-10-07":[{sport:"Boys Varsity Soccer",match:"Old Orchard vs Lincoln Hall",loc:"Old Orchard",time:"4:00 PM",note:"",ref:"",type:"soccer"}]
  }/*FALLBACK_END*/;

  // ── State ──────────────────────────────────────────────────────────
  let DATA = {};                 // { "YYYY-MM-DD": [event, ...] }
  let cursor = new Date();       // month being displayed
  let view = window.innerWidth < 641 ? 'agenda' : 'month';
  let activeSports = null;       // null = show all
  let agendaScrolled = false;

  const $ = id => document.getElementById(id);
  const grid=$('grid'), agenda=$('agenda'), monthEl=$('month'), statusEl=$('status'),
        nextUp=$('next-up'), chips=$('chips'), modal=$('modal'),
        mTitle=$('mTitle'), mBody=$('mBody');

  const MONTHS = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];

  const pad = n => n < 10 ? '0'+n : ''+n;
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
  const TODAY = key(new Date());
  const longDate  = k => fromKey(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const shortDate = k => fromKey(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  // Events on a date, after category filtering.
  function eventsOn(k){
    const list = DATA[k] || [];
    if (!activeSports || !activeSports.size) return list;
    return list.filter(e => activeSports.has(catOf(e)));
  }
  function datesWithEvents(){
    return Object.keys(DATA).filter(k => eventsOn(k).length).sort();
  }

  // ── Event card (agenda + modal) ────────────────────────────────────
  function card(ev, i){
    const m = meta(ev.type);
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--c', m.c);
    el.style.animationDelay = `${Math.min(i||0,8)*40}ms`;

    const ico = document.createElement('div');
    ico.className = 'ico'; ico.textContent = m.i;

    const bd = document.createElement('div'); bd.className = 'bd';
    const sp = document.createElement('div'); sp.className='sp'; sp.textContent = ev.sport || '';
    const mt = document.createElement('div'); mt.className='mt'; mt.textContent = ev.match || 'Game';
    const info = document.createElement('div'); info.className='meta';
    const add = (label,val) => {
      if(!val) return;
      const s=document.createElement('span'); const b=document.createElement('b');
      b.textContent=label+': '; s.appendChild(b); s.appendChild(document.createTextNode(val));
      info.appendChild(s);
    };
    add('Time', ev.time); add('Location', ev.loc); add('Official', ev.ref);

    bd.appendChild(sp); bd.appendChild(mt); bd.appendChild(info);
    if (ev.note){ const n=document.createElement('span'); n.className='note'; n.textContent=ev.note; bd.appendChild(n); }
    el.appendChild(ico); el.appendChild(bd);
    return el;
  }

  // ── Month grid ─────────────────────────────────────────────────────
  function renderMonth(){
    const y = cursor.getFullYear(), mo = cursor.getMonth();
    monthEl.textContent = `${MONTHS[mo]} ${y}`;
    monthEl.classList.remove('flip'); void monthEl.offsetWidth; monthEl.classList.add('flip');

    grid.innerHTML = '';
    const first = new Date(y,mo,1).getDay();
    const days  = new Date(y,mo+1,0).getDate();

    for(let i=0;i<first;i++){
      const c=document.createElement('div'); c.className='cell pad'; grid.appendChild(c);
    }
    for(let d=1; d<=days; d++){
      const k = `${y}-${pad(mo+1)}-${pad(d)}`;
      const evs = eventsOn(k);
      const c = document.createElement('div');
      c.className = 'cell' + (evs.length?' has':'') + (k===TODAY?' today':'');
      c.style.animationDelay = `${Math.min(d,20)*12}ms`;

      const num=document.createElement('div'); num.className='num'; num.textContent=d;
      c.appendChild(num);

      if(evs.length){
        const box=document.createElement('div'); box.className='pills';
        evs.forEach(ev=>{
          const p=document.createElement('div'); p.className='pill';
          p.style.setProperty('--c', meta(ev.type).c);
          const t=(ev.time||'').replace(':00','').replace(' PM','p').replace(' AM','a');
          // Sports show the team/level, except feed-sourced athletics
          // (e.g. "RED OUT for Girls Varsity Volleyball") whose title is
          // the informative part.
          const isSport = catOf(ev)==='sports' && ev.sport !== 'Athletics';
          const s = isSport
            ? (ev.sport||'').replace('Boys Varsity','B.Var').replace('Boys JV','B.JV')
                  .replace('Boys Jr. Varsity','B.JV').replace('Boys Jr.Varsity','B.JV')
                  .replace('Girls Varsity','G.Var').replace('Girls JV','G.JV')
                  .replace('Girls Jr. Varsity','G.JV')
            : (ev.match||'');
          if(ev.type==='halfday'){
            p.textContent = '🕧 Half Day';
            p.classList.add('status');
          }else if(ev.type==='noschool'){
            const why = (ev.match||'').replace(/\s*[-–]\s*(no school|district closed)\s*$/i,'').trim();
            p.textContent = (!why || /^no school$/i.test(why)) ? '🚫 No School' : `🚫 ${why} · No School`;
            p.classList.add('status');
          }else{
            p.textContent = `${t} ${s}`.trim();
          }
          p.title = `${ev.match||''}${ev.time?' · '+ev.time:''}${ev.loc?' · '+ev.loc:''}`;
          box.appendChild(p);
        });
        c.appendChild(box);

        const dots=document.createElement('div'); dots.className='dots';
        evs.slice(0,4).forEach(ev=>{
          const i=document.createElement('i');
          i.style.setProperty('--c', meta(ev.type).c); dots.appendChild(i);
        });
        c.appendChild(dots);
        c.addEventListener('click',()=>openModal(k,evs));
      }
      grid.appendChild(c);
    }
    requestAnimationFrame(fitPills);
  }

  // ── Agenda ─────────────────────────────────────────────────────────
  function renderAgenda(){
    agenda.innerHTML='';
    const keys = datesWithEvents();
    if(!keys.length){ agenda.appendChild(emptyState()); return; }

    let placed=false, divider=null, n=0;
    keys.forEach(k=>{
      if(!placed && k>=TODAY){
        divider=document.createElement('div'); divider.className='divider';
        divider.innerHTML='<span>Today</span>'; agenda.appendChild(divider); placed=true;
      }
      const g=document.createElement('div');
      g.className='grp'+(k<TODAY?' past':'');
      const h=document.createElement('h3'); h.textContent=longDate(k); g.appendChild(h);
      eventsOn(k).forEach(ev=>{ g.appendChild(card(ev,n)); n++; });
      agenda.appendChild(g);
    });

    if(!agendaScrolled){
      agendaScrolled=true;
      requestAnimationFrame(()=>{
        const t = divider || agenda.lastElementChild;
        if(t) agenda.scrollTop = Math.max(0, t.offsetTop-8);
      });
    }
  }

  function emptyState(){
    const d=document.createElement('div'); d.className='empty';
    const b=document.createElement('b');
    b.textContent = Object.keys(DATA).length ? 'No games match this filter'
                                             : 'Schedule unavailable';
    d.appendChild(b);
    const unlinked = !/^https?:/i.test(EVENTS_JSON_URL);
    if(!Object.keys(DATA).length && unlinked) b.textContent='This copy of the calendar isn\u2019t set up yet';
    d.appendChild(document.createTextNode(
      Object.keys(DATA).length
        ? 'Try turning a sport filter back on.'
        : unlinked
          ? 'This is the template file. In the GitHub repository, open embed.html (the updater creates it on every run) and paste that into Google Sites instead.'
          : "Couldn't load the schedule right now. It updates automatically a few times a day."
    ));
    if(!Object.keys(DATA).length){
      const r=document.createElement('button'); r.className='retry'; r.textContent='Try again';
      r.addEventListener('click',load); d.appendChild(document.createElement('br')); d.appendChild(r);
    }
    return d;
  }

  // ── Next-up banner ─────────────────────────────────────────────────
  function renderNext(){
    const keys = datesWithEvents();
    const k = keys.find(x => x >= TODAY);
    nextUp.innerHTML='';
    const lab=document.createElement('span'); lab.className='lab'; lab.textContent='Next up';
    if(!k){
      lab.textContent = keys.length ? 'No upcoming games scheduled' : 'No games loaded';
      nextUp.appendChild(lab); return;
    }
    const evs=eventsOn(k), ev=evs[0], extra = evs.length>1 ? ` (+${evs.length-1} more that day)` : '';
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=meta(ev.type).c;
    const m=document.createElement('span'); m.className='m'; m.textContent=ev.match||'Game';
    const d=document.createElement('span'); d.className='d';
    d.textContent = `${ev.sport||''}, ${k===TODAY?'Today':shortDate(k)}`
                  + (ev.time?` at ${ev.time}`:'') + (ev.loc?`, ${ev.loc}`:'') + extra;
    nextUp.append(lab,dot,m,d);
  }

  // ── Sport filter chips ─────────────────────────────────────────────
  function renderChips(){
    const all = Object.values(DATA).flat();
    const counts = {};
    all.forEach(e => { const c = catOf(e); counts[c] = (counts[c]||0)+1; });
    const present = Object.keys(CATS).filter(c => counts[c]);

    chips.innerHTML='';
    if(present.length<2) return;      // nothing useful to filter
    present.forEach(c=>{
      const b=document.createElement('button');
      const on = !activeSports || activeSports.has(c);
      b.className='chip'+(on?' on':'')+(c==='district'?' district':'');
      b.textContent=`${CATS[c].i} ${CATS[c].label}`;
      b.title = `${counts[c]} event${counts[c]===1?'':'s'} — click to show or hide`;
      b.setAttribute('aria-pressed', String(on));
      b.addEventListener('click',()=>{
        if(!activeSports) activeSports=new Set(present);
        activeSports.has(c) ? activeSports.delete(c) : activeSports.add(c);
        if(activeSports.size===present.length) activeSports=null;
        agendaScrolled=false; renderAll();
      });
      chips.appendChild(b);
    });
  }

  function fitPills(){
    grid.querySelectorAll('.cell.has').forEach(cell=>{
      const box=cell.querySelector('.pills'); if(!box||!box.getBoundingClientRect) return;
      const pills=[...box.querySelectorAll('.pill')];
      const old=box.querySelector('.more'); if(old) old.remove();
      pills.forEach(p=>p.style.display='');
      if(!pills.length || getComputedStyle(pills[0]).display==='none') return; // phones use dots
      const limit=box.getBoundingClientRect().bottom+0.5;
      if(pills[pills.length-1].getBoundingClientRect().bottom<=limit) return;   // all fit
      const more=document.createElement('div'); more.className='more'; box.appendChild(more);
      let shown=pills.length;
      const update=()=>{ more.textContent=`+${pills.length-shown} more`; };
      update();
      while(shown>0 && more.getBoundingClientRect().bottom>limit){
        pills[--shown].style.display='none'; update();
      }
      // A single event that still doesn't fit is better shown clipped than
      // replaced entirely by "+1 more".
      if(shown===0){ pills[0].style.display=''; more.remove(); }
    });
  }
  let fitTimer=null;
  window.addEventListener('resize',()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(fitPills,120); });

  function renderAll(){ renderChips(); renderMonth(); renderAgenda(); renderNext(); }

  // ── Modal ──────────────────────────────────────────────────────────
  function openModal(k,evs){
    mTitle.textContent=longDate(k);
    mBody.innerHTML='';
    evs.forEach((e,i)=>mBody.appendChild(card(e,i)));
    modal.classList.add('on');
  }
  const closeModal=()=>modal.classList.remove('on');
  $('mX').addEventListener('click',closeModal);
  $('mClose').addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal.classList.contains('on')) closeModal(); });

  // ── Views + navigation ─────────────────────────────────────────────
  function setView(v){
    view=v; const isM = v==='month';
    $('pMonth').classList.toggle('on',isM);
    $('pAgenda').classList.toggle('on',!isM);
    $('vMonth').classList.toggle('on',isM);
    $('vAgenda').classList.toggle('on',!isM);
    $('vMonth').setAttribute('aria-selected',String(isM));
    $('vAgenda').setAttribute('aria-selected',String(!isM));
  }
  $('vMonth').addEventListener('click',()=>setView('month'));
  $('vAgenda').addEventListener('click',()=>setView('agenda'));
  $('prev').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()-1);renderMonth();});
  $('next').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()+1);renderMonth();});
  $('todayBtn').addEventListener('click',()=>{ cursor=new Date(); renderMonth(); });
  setView(view);

  // Open on the most useful month: the one holding the next upcoming
  // game, else the most recent month that has games, else today.
  function pickMonth(){
    const keys=datesWithEvents();
    if(!keys.length){ cursor=new Date(); return; }
    const upcoming = keys.find(k=>k>=TODAY);
    cursor = fromKey(upcoming || keys[keys.length-1]);
    cursor.setDate(1);
  }

  // ── Load ───────────────────────────────────────────────────────────
  function fmtWhen(iso){
    try{ return new Date(iso).toLocaleString('en-US',
      {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
    catch(e){ return null; }
  }

  async function load(){
    statusEl.textContent='Loading…';
    try{
      const res = await fetch(EVENTS_JSON_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const evs = data && data.events;
      if(!evs || typeof evs!=='object') throw new Error('unexpected format');
      const count = Object.keys(evs).length;
      if(count === 0) throw new Error('feed contained no dates');
      DATA = evs;
      const when = fmtWhen(data.generated_at);
      statusEl.textContent = when ? `Updated ${when}` : 'Live schedule';
      statusEl.title = 'Loaded live from ' + EVENTS_JSON_URL;
    }catch(err){
      console.warn('Live schedule unavailable, using saved copy:', err);
      DATA = FALLBACK;
      const n = Object.keys(FALLBACK).length;
      statusEl.textContent = n ? 'Saved schedule' : 'Schedule unavailable';
      // Hovering the status shows the actual reason, which makes this
      // diagnosable without opening the browser console.
      statusEl.title = 'Could not load live schedule (' + (err && err.message ? err.message : err)
                     + '). Showing the copy saved with this page.';
    }
    agendaScrolled=false;
    pickMonth();
    renderAll();
  }

  load();


});
</script>
</body>
</html>
