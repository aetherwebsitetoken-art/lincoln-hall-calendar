<style>
  /* ---------- Reset ---------- */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; }

  /* ---------- Tokens ---------- */
  :root {
    --ink: #15171c;
    --ink-soft: #555963;
    --ink-faint: #8a8e97;
    --paper: #ffffff;
    --seam: #edeeeb;
    --seam-strong: #dcded9;
    --red: #c8112e;
    --red-dark: #96001c;
    --soccer: #2f6f4e;
    --volleyball: #c08a1e;
    --basketball: #2c5c8a;
    --other: #6b5b95;
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--seam); }
  ::-webkit-scrollbar-thumb { background: var(--seam-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

  /* ---------- Focus ---------- */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--red); outline-offset: 2px;
  }

  /* ---------- Page shell ---------- */
  .page { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* ---------- Header ---------- */
  .site-header { flex-shrink: 0; background: var(--ink); color: #fff; border-bottom: 4px solid var(--red); }
  .header-inner {
    max-width: 1600px; margin: 0 auto; width: 100%;
    padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 7px; flex-shrink: 0;
    background: repeating-linear-gradient(135deg, var(--red) 0 7px, var(--ink) 7px 14px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .brand-name {
    font-family: var(--font-display); font-weight: 400; letter-spacing: 0.3px;
    font-size: 20px; line-height: 1; margin: 0;
  }
  .brand-sub { font-size: 11px; color: #b9bcc4; margin: 3px 0 0; font-weight: 500; }

  .month-nav { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.18); }
  .month-label-wrap { text-align: center; min-width: 150px; }
  .month-label {
    font-family: var(--font-display); font-weight: 400; font-size: 18px;
    color: #fff; margin: 0; letter-spacing: 0.3px; white-space: nowrap;
  }
  .sync-status { font-size: 10px; color: #9a9dab; margin: 2px 0 0; min-height: 12px; }

  .view-toggle {
    display: flex; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 3px;
    flex-shrink: 0;
  }
  .toggle-btn {
    border: none; background: transparent; color: #c7c9d1; cursor: pointer;
    font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toggle-btn.active { background: var(--red); color: #fff; }

  /* ---------- Next up banner ---------- */
  .next-up { flex-shrink: 0; background: var(--seam); border-bottom: 1px solid var(--seam-strong); }
  .next-up-inner {
    max-width: 1600px; margin: 0 auto; width: 100%; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .next-up-label { font-size: 12px; color: var(--ink-soft); font-weight: 500; flex-shrink: 0; }
  .next-up-body { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .next-up-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .next-up-match { font-weight: 700; font-size: 14px; color: var(--ink); }
  .next-up-meta { font-size: 13px; color: var(--ink-soft); }
  .next-up-empty { font-size: 13px; color: var(--ink-soft); font-style: normal; }

  /* ---------- Main area ---------- */
  main { flex: 1; min-height: 0; width: 100%; }
  .view-panel { width: 100%; height: 100%; display: none; }
  .view-panel.is-active { display: flex; flex-direction: column; }
  .view-inner { max-width: 1600px; margin: 0 auto; width: 100%; height: 100%; display: flex; flex-direction: column; }

  /* ---------- Month grid ---------- */
  .weekday-row {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    background: var(--paper); border-bottom: 1px solid var(--seam-strong); flex-shrink: 0;
  }
  .weekday-row div {
    padding: 8px 4px; text-align: center; font-size: 11px; font-weight: 600;
    color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px;
  }
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(96px, 1fr); gap: 1px; background: var(--seam);
    flex: 1; overflow-y: auto;
  }
  .day-cell {
    background: var(--paper); padding: 6px; cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    transition: background 0.12s ease;
  }
  .day-cell:hover { background: #fafaf9; }
  .day-cell.empty { background: var(--seam); cursor: default; }
  .day-cell.has-events:hover { background: #fdf4f5; }
  .day-num {
    font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 3px;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .day-cell.is-today .day-num { background: var(--red); color: #fff; }
  .day-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1; }
  .ticket-mini {
    font-size: 10px; line-height: 1.3; padding: 2px 4px; border-left: 3px solid var(--sport-color, var(--ink));
    background: var(--seam); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-radius: 0 3px 3px 0;
  }
  .ticket-mini-more { font-size: 10px; color: var(--ink-soft); font-weight: 600; padding-left: 4px; }
  .day-dots { display: flex; gap: 3px; margin-top: auto; padding-top: 2px; }
  .day-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sport-color, var(--ink)); }

  /* ---------- Agenda ---------- */
  .agenda-scroll { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
  .agenda-date-group { margin-bottom: 18px; }
  .agenda-date-group.is-past { opacity: 0.55; }
  .agenda-date-heading {
    font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--seam-strong);
  }
  .today-divider {
    display: flex; align-items: center; gap: 10px; margin: 4px 0 20px; color: var(--red);
  }
  .today-divider::before, .today-divider::after { content: ''; flex: 1; height: 1px; background: var(--red); opacity: 0.35; }
  .today-divider span { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .agenda-empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; }

  /* ---------- Ticket rows (agenda + modal) ---------- */
  .ticket-full {
    display: flex; gap: 12px; padding: 10px 12px; margin-bottom: 6px;
    border-left: 4px solid var(--sport-color, var(--ink)); background: var(--paper);
    border-radius: 0 8px 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .ticket-icon { font-size: 20px; flex-shrink: 0; line-height: 1.3; }
  .ticket-body { flex: 1; min-width: 0; }
  .ticket-sport { font-size: 11px; font-weight: 700; color: var(--sport-color, var(--ink)); }
  .ticket-match { font-size: 15px; font-weight: 700; color: var(--ink); margin: 2px 0 4px; }
  .ticket-details { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-soft); }
  .ticket-details strong { color: var(--ink); font-weight: 600; }
  .ticket-note {
    display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 600;
    background: var(--seam); padding: 2px 8px; border-radius: 4px; color: var(--ink);
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(21,23,28,0.6); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-backdrop.is-open { display: flex; }
  .modal-box {
    background: var(--paper); width: 100%; max-width: 560px; border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; max-height: 88vh;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-head {
    background: var(--ink); color: #fff; padding: 16px 18px;
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .modal-head h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; letter-spacing: 0.3px; }
  .modal-close {
    background: rgba(255,255,255,0.1); border: none; color: #fff; width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .modal-close:hover { background: rgba(255,255,255,0.22); }
  .modal-body { padding: 14px 16px; overflow-y: auto; background: var(--seam); flex: 1; }
  .modal-foot { padding: 12px 16px; border-top: 1px solid var(--seam-strong); display: flex; justify-content: flex-end; flex-shrink: 0; }
  .btn-dark {
    background: var(--ink); color: #fff; border: none; padding: 9px 20px; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 13.5px;
  }
  .btn-dark:hover { background: #262931; }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .header-inner { padding: 8px 12px; gap: 10px; }
    .brand-sub { display: none; }
    .brand-name { font-size: 17px; }
    .month-label { font-size: 15px; }
    .month-label-wrap { min-width: 110px; }
    .view-toggle { order: 3; width: 100%; justify-content: center; }
    .calendar-grid { grid-auto-rows: minmax(64px, 1fr); }
    .ticket-mini { display: none; }
    .day-dots { display: flex; }
  }
  @media (min-width: 641px) {
    .day-dots { display: none; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>

</div>

  let agendaScrolledOnce = false;

  // ---------- DOM refs ----------
  const gridEl = document.getElementById('calendar-grid');
  const monthYearEl = document.getElementById('current-month-year');
  const syncStatusEl = document.getElementById('sync-status');
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  const viewMonthBtn = document.getElementById('view-month-btn');
  const viewAgendaBtn = document.getElementById('view-agenda-btn');
  const monthPanel = document.getElementById('month-view');
  const agendaPanel = document.getElementById('agenda-view');
  const agendaScroll = document.getElementById('agenda-scroll');
  const nextUpInner = document.getElementById('next-up-inner');

  const modalEl = document.getElementById('event-modal');
  const modalDateTitle = document.getElementById('modal-date-title');
  const modalEventsList = document.getElementById('modal-events-list');
  const closeBtn = document.getElementById('close-modal');
  const closeBtnFooter = document.getElementById('close-modal-btn');

  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // ---------- Date helpers ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function keyToDate(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d); }
  function formatLong(key) {
    return keyToDate(key).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function formatShort(key) {
    return keyToDate(key).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  const todayKey = toKey(new Date());

  // ---------- Ticket row builder (used by agenda + modal) ----------
  function buildTicketFull(ev) {
    const meta = sportMeta(ev.type);
    const card = document.createElement('div');
    card.className = 'ticket-full';
    card.style.setProperty('--sport-color', meta.color);

    const icon = document.createElement('div');
    icon.className = 'ticket-icon';
    icon.textContent = meta.icon;

    const body = document.createElement('div');
    body.className = 'ticket-body';

    const sportEl = document.createElement('div');
    sportEl.className = 'ticket-sport';
    sportEl.textContent = ev.sport;

    const matchEl = document.createElement('div');
    matchEl.className = 'ticket-match';
    matchEl.textContent = ev.match;

    const details = document.createElement('div');
    details.className = 'ticket-details';
    if (ev.time) details.appendChild(detailSpan('Time', ev.time));
    if (ev.loc) details.appendChild(detailSpan('Location', ev.loc));
    if (ev.ref) details.appendChild(detailSpan('Official', ev.ref));

    body.appendChild(sportEl);
    body.appendChild(matchEl);
    body.appendChild(details);

    if (ev.note) {
      const noteEl = document.createElement('span');
      noteEl.className = 'ticket-note';
      noteEl.textContent = ev.note;
      body.appendChild(noteEl);
    }

    card.appendChild(icon);
    card.appendChild(body);
    return card;
  }

  function detailSpan(label, value) {
    const s = document.createElement('span');
    const strong = document.createElement('strong');
    strong.textContent = label + ': ';
    s.appendChild(strong);
    s.appendChild(document.createTextNode(value));
    return s;
  }

  // ---------- Month grid ----------
  function renderMonthGrid() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    monthYearEl.textContent = `${monthNames[month]} ${year}`;

    gridEl.innerHTML = '';
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell empty';
      gridEl.appendChild(cell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = `${year}-${pad(month+1)}-${pad(day)}`;
      const dayEvents = eventsData[dateKey] || [];

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (dayEvents.length ? ' has-events' : '') + (dateKey === todayKey ? ' is-today' : '');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = day;
      cell.appendChild(num);

      if (dayEvents.length) {
        const list = document.createElement('div');
        list.className = 'day-events';
        const limit = 3;
        dayEvents.slice(0, limit).forEach(ev => {
          const meta = sportMeta(ev.type);
          const mini = document.createElement('div');
          mini.className = 'ticket-mini';
          mini.style.setProperty('--sport-color', meta.color);
          const shortSport = ev.sport
            .replace('Boys Varsity', 'B.Var').replace('Boys JV', 'B.JV')
            .replace('Girls Varsity', 'G.Var').replace('Girls JV', 'G.JV');
          const shortTime = (ev.time || '').replace(':00', '').replace(' PM','p').replace(' AM','a');
          mini.textContent = `${shortTime} ${shortSport}`.trim();
          list.appendChild(mini);
        });
        if (dayEvents.length > limit) {
          const more = document.createElement('div');
          more.className = 'ticket-mini-more';
          more.textContent = `+${dayEvents.length - limit} more`;
          list.appendChild(more);
        }
        cell.appendChild(list);

        const dots = document.createElement('div');
        dots.className = 'day-dots';
        dayEvents.slice(0, 4).forEach(ev => {
          const dot = document.createElement('div');
          dot.className = 'day-dot';
          dot.style.setProperty('--sport-color', sportMeta(ev.type).color);
          dots.appendChild(dot);
        });
        cell.appendChild(dots);

        cell.addEventListener('click', () => openModal(dateKey, dayEvents));
      }

      gridEl.appendChild(cell);
    }
  }

  // ---------- Agenda ----------
  function renderAgenda() {
    agendaScroll.innerHTML = '';
    const keys = Object.keys(eventsData).sort();

    if (!keys.length) {
      const empty = document.createElement('div');
      empty.className = 'agenda-empty';
      empty.textContent = 'No games on the schedule yet. New dates will appear here automatically once they\u2019re posted.';
      agendaScroll.appendChild(empty);
      return;
    }

    let dividerPlaced = false;
    let dividerEl = null;

    keys.forEach(key => {
      if (!dividerPlaced && key >= todayKey) {
        dividerEl = document.createElement('div');
        dividerEl.className = 'today-divider';
        dividerEl.innerHTML = '<span>Today</span>';
        agendaScroll.appendChild(dividerEl);
        dividerPlaced = true;
      }

      const group = document.createElement('div');
      group.className = 'agenda-date-group' + (key < todayKey ? ' is-past' : '');

      const heading = document.createElement('div');
      heading.className = 'agenda-date-heading';
      heading.textContent = formatLong(key);
      group.appendChild(heading);

      eventsData[key].forEach(ev => group.appendChild(buildTicketFull(ev)));
      agendaScroll.appendChild(group);
    });

    if (!agendaScrolledOnce) {
      agendaScrolledOnce = true;
      requestAnimationFrame(() => {
        const target = dividerEl || agendaScroll.lastElementChild;
        if (target) agendaScroll.scrollTop = Math.max(0, target.offsetTop - 8);
      });
    }
  }

  // ---------- Next up banner ----------
  function renderNextUp() {
    const keys = Object.keys(eventsData).sort();
    const upcomingKey = keys.find(k => k >= todayKey);

    if (!upcomingKey) {
      nextUpInner.innerHTML = '<span class="next-up-label">Next up</span><span class="next-up-empty">No upcoming games scheduled yet</span>';
      return;
    }

    const dayEvents = eventsData[upcomingKey];
    const ev = dayEvents[0];
    const meta = sportMeta(ev.type);
    const extra = dayEvents.length > 1 ? ` (+${dayEvents.length - 1} more that day)` : '';
    const when = upcomingKey === todayKey ? 'Today' : formatShort(upcomingKey);

    nextUpInner.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'next-up-label';
    label.textContent = 'Next up';

    const body = document.createElement('div');
    body.className = 'next-up-body';
    const dot = document.createElement('span');
    dot.className = 'next-up-dot';
    dot.style.background = meta.color;
    const match = document.createElement('span');
    match.className = 'next-up-match';
    match.textContent = ev.match;
    const metaText = document.createElement('span');
    metaText.className = 'next-up-meta';
    metaText.textContent = `${ev.sport}, ${when} at ${ev.time}${ev.loc ? ', ' + ev.loc : ''}${extra}`;

    body.appendChild(dot);
    body.appendChild(match);
    body.appendChild(metaText);
    nextUpInner.appendChild(label);
    nextUpInner.appendChild(body);
  }

  function renderAll() {
    renderMonthGrid();
    renderAgenda();
    renderNextUp();
  }

  // ---------- Modal ----------
  function openModal(dateKey, dayEvents) {
    modalDateTitle.textContent = formatLong(dateKey);
    modalEventsList.innerHTML = '';
    dayEvents.forEach(ev => modalEventsList.appendChild(buildTicketFull(ev)));
    modalEl.classList.add('is-open');
  }
  function closeModal() { modalEl.classList.remove('is-open'); }

  // ---------- View toggle ----------
  function setView(mode) {
    viewMode = mode;
    const isMonth = mode === 'month';
    monthPanel.classList.toggle('is-active', isMonth);
    agendaPanel.classList.toggle('is-active', !isMonth);
    viewMonthBtn.classList.toggle('active', isMonth);
    viewAgendaBtn.classList.toggle('active', !isMonth);
    viewMonthBtn.setAttribute('aria-selected', String(isMonth));
    viewAgendaBtn.setAttribute('aria-selected', String(!isMonth));
  }
  viewMonthBtn.addEventListener('click', () => setView('month'));
  viewAgendaBtn.addEventListener('click', () => setView('agenda'));
  setView(viewMode);

  // ---------- Month navigation ----------
  prevBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderMonthGrid(); });
  nextBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderMonthGrid(); });

  // ---------- Modal listeners ----------
  closeBtn.addEventListener('click', closeModal);
  closeBtnFooter.addEventListener('click', closeModal);
  modalEl.addEventListener('click', (e) => { if (e.target === modalEl) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalEl.classList.contains('is-open')) closeModal(); });

  // ---------- Live data loading ----------
  // events.json is written automatically by scrape_schedule.py (run by a
  // GitHub Action a few times a day). It lives right next to this HTML file,
  // so this fetch is same-origin -- the browser never talks to
  // quickscores.com directly, which is what lets this work even on networks
  // that block that site.
  function formatSyncTime(iso) {
    try {
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return null; }
  }

  async function loadEvents() {
    try {
      const res = await fetch('events.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || typeof data.events !== 'object') throw new Error('Unexpected events.json shape');
      eventsData = data.events;
      const when = formatSyncTime(data.generated_at);
      syncStatusEl.textContent = when ? `Updated ${when}` : 'Live schedule loaded';
    } catch (err) {
      console.warn('Could not load events.json, showing built-in fallback schedule:', err);
      syncStatusEl.textContent = 'Showing saved schedule';
    }
    renderAll();
  }

  loadEvents();
});
</script>
</body>
</html>
