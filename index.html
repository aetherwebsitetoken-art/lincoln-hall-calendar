<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lincoln Hall Athletics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root {
    --ink:#0d0d0f; --ink-soft:#54565c; --ink-faint:#93959c;
    --paper:#fff; --seam:#f2f2f2; --seam-2:#e3e3e3;
    --red:#d81324; --red-dark:#a00d1b;
    --display:'Anton','Arial Narrow',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--seam)}
  ::-webkit-scrollbar-thumb{background:var(--seam-2);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  .page{display:flex;flex-direction:column;width:100%;height:100%;opacity:0;animation:fade .45s var(--ease) forwards}
  @keyframes fade{to{opacity:1}}

  /* Header */
  .top{flex-shrink:0;background:var(--ink);color:#fff;border-bottom:4px solid var(--red);
    opacity:0;transform:translateY(-8px);animation:drop .45s var(--ease) .05s forwards}
  @keyframes drop{to{opacity:1;transform:none}}
  .top-in{max-width:1600px;margin:0 auto;width:100%;padding:10px 16px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .mark{width:38px;height:38px;border-radius:7px;flex-shrink:0;
    background:repeating-linear-gradient(135deg,var(--red) 0 7px,var(--ink) 7px 14px);
    border:1px solid rgba(255,255,255,.16);transition:transform .35s var(--ease)}
  .brand:hover .mark{transform:rotate(8deg) scale(1.06)}
  .brand h1{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;margin:0;letter-spacing:.3px}
  .brand p{margin:3px 0 0;font-size:11px;color:#b8bbc3;font-weight:500}

  .nav{display:flex;align-items:center;gap:8px;margin-left:auto}
  /* Circle styling applies to the ‹ › arrows only -- the Today button is a
     pill and must not be forced into a 32px circle. */
  .nav button.arrow{width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.08);color:#fff;font-size:18px;line-height:1;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
  .nav button.arrow:hover{background:var(--red)}
  .nav button.arrow:active{transform:scale(.88)}
  .mlabel{text-align:center;min-width:150px;overflow:hidden}
  .mlabel h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:#fff;
    white-space:nowrap;display:inline-block}
  .mlabel h2.flip{animation:flip .3s var(--ease)}
  @keyframes flip{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
  .status{font-size:10px;color:#989aa6;margin:2px 0 0;min-height:12px}
  .today-btn{border:none;background:rgba(255,255,255,.08);color:#d7d9df;cursor:pointer;
    font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;flex-shrink:0;
    width:auto;height:auto;line-height:1.1;white-space:nowrap;
    transition:background .15s,color .15s,transform .15s}
  .today-btn:hover{background:var(--red);color:#fff}
  .today-btn:active{transform:scale(.94)}

  .views{display:flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;flex-shrink:0}
  .views button{border:none;background:transparent;color:#c5c7cf;cursor:pointer;font-size:13px;
    font-weight:600;padding:6px 14px;border-radius:6px;transition:background .2s,color .2s}
  .views button.on{background:var(--red);color:#fff}

  /* Filters + next up */
  .strip{flex-shrink:0;background:var(--seam);border-bottom:1px solid var(--seam-2);
    opacity:0;transform:translateY(-6px);animation:drop .45s var(--ease) .12s forwards}
  .strip-in{max-width:1600px;margin:0 auto;width:100%;padding:9px 16px;
    display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
  .next{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .next .lab{font-size:12px;color:var(--ink-soft);font-weight:600;flex-shrink:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;
    align-self:center;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,19,36,.45)}50%{box-shadow:0 0 0 6px rgba(216,19,36,0)}}
  .next .m{font-weight:700;font-size:14px}
  .next .d{font-size:13px;color:var(--ink-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--seam-2);background:var(--paper);color:var(--ink-soft);
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s}
  .chip:hover{border-color:var(--ink-faint)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on.red{background:var(--red);border-color:var(--red)}

  main{flex:1;min-height:0;width:100%;position:relative}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;
    pointer-events:none;transition:opacity .28s var(--ease)}
  .panel.on{opacity:1;pointer-events:auto}
  .wrap{max-width:1600px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column}

  /* Month grid */
  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex-shrink:0;
    border-bottom:1px solid var(--seam-2)}
  .dow div{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;
    color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    grid-auto-rows:minmax(96px,1fr);gap:1px;background:var(--seam);flex:1;overflow-y:auto}
  .cell{background:var(--paper);padding:6px;overflow:hidden;display:flex;flex-direction:column;
    position:relative;transition:transform .15s var(--ease),box-shadow .15s,background .15s;
    opacity:0;animation:cin .3s var(--ease) forwards}
  @keyframes cin{to{opacity:1}}
  .cell.has{cursor:pointer}
  .cell.has:hover{background:#fff;transform:scale(1.035);box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:2}
  .cell.pad{background:var(--seam)}
  .num{font-size:13px;font-weight:600;color:var(--ink-soft);width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px}
  .cell.today .num{background:var(--red);color:#fff}
  .pills{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1}
  .pill{font-size:10px;line-height:1.3;padding:2px 4px;border-left:3px solid var(--c,var(--ink));
    background:var(--seam);border-radius:0 3px 3px 0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;transition:background .15s}
  .cell:hover .pill{background:#fff}
  .more{font-size:10px;color:var(--ink-soft);font-weight:700;padding-left:4px}
  .dots{display:flex;gap:3px;margin-top:auto;padding-top:2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--ink))}

  /* Agenda */
  .agenda{flex:1;overflow-y:auto;padding:14px 16px 48px}
  .grp{margin-bottom:18px}
  .grp.past{opacity:.48}
  .grp h3{font-size:13px;font-weight:700;margin:0 0 8px;padding-bottom:6px;
    border-bottom:1px solid var(--seam-2)}
  .divider{display:flex;align-items:center;gap:10px;margin:4px 0 20px;color:var(--red)}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--red);opacity:.35}
  .divider span{font-size:12px;font-weight:700;letter-spacing:.3px}

  .card{display:flex;gap:12px;padding:10px 12px;margin-bottom:6px;background:var(--paper);
    border-left:4px solid var(--c,var(--ink));border-radius:0 8px 8px 0;
    box-shadow:0 1px 2px rgba(0,0,0,.05);opacity:0;transform:translateX(-6px);
    animation:cardin .32s var(--ease) forwards;transition:box-shadow .2s,transform .2s}
  .card:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateX(2px)}
  @keyframes cardin{to{opacity:1;transform:none}}
  .card .ico{font-size:20px;flex-shrink:0;line-height:1.3}
  .card .bd{flex:1;min-width:0}
  .card .sp{font-size:11px;font-weight:700;color:var(--c,var(--ink))}
  .card .mt{font-size:15px;font-weight:700;margin:2px 0 4px}
  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-soft)}
  .meta b{color:var(--ink);font-weight:600}
  .note{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;
    background:var(--seam);padding:2px 8px;border-radius:4px}

  .empty{padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.6}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
  .retry{margin-top:14px;background:var(--ink);color:#fff;border:none;padding:9px 18px;
    border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
  .retry:hover{background:var(--red)}

  /* Modal */
  .back{position:fixed;inset:0;background:rgba(13,13,15,.62);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:50;
    opacity:0;transition:opacity .2s}
  .back.on{display:flex;opacity:1}
  .box{background:var(--paper);width:100%;max-width:560px;border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;max-height:88vh;box-shadow:0 20px 50px rgba(0,0,0,.3);
    transform:scale(.94) translateY(10px);opacity:0;transition:transform .25s var(--ease),opacity .25s}
  .back.on .box{transform:none;opacity:1}
  .box .hd{background:var(--ink);color:#fff;padding:15px 18px;display:flex;
    justify-content:space-between;align-items:center;flex-shrink:0}
  .box .hd h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0;letter-spacing:.3px}
  .x{background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:50%;
    cursor:pointer;font-size:15px;flex-shrink:0;transition:background .15s,transform .2s}
  .x:hover{background:var(--red);transform:rotate(90deg)}
  .box .bdy{padding:14px 16px;overflow-y:auto;background:var(--seam);flex:1}
  .box .ft{padding:12px 16px;border-top:1px solid var(--seam-2);display:flex;justify-content:flex-end}
  .close{background:var(--ink);color:#fff;border:none;padding:9px 20px;border-radius:8px;
    font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,transform .1s}
  .close:hover{background:var(--red)}
  .close:active{transform:scale(.96)}

  @media (max-width:640px){
    .top-in{padding:8px 12px;gap:8px}
    .brand p{display:none}
    .brand h1{font-size:17px}
    .mlabel{min-width:104px}
    .mlabel h2{font-size:15px}
    .views{order:3;width:100%;justify-content:center}
    .today-btn{padding:6px 10px;font-size:11px}
    .grid{grid-auto-rows:minmax(62px,1fr)}
    .pill{display:none}
    .dots{display:flex}
  }
  @media (min-width:641px){.dots{display:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .page,.top,.strip,.cell,.card{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div><h1>Lincoln Hall</h1><p>Athletics</p></div>
      </div>
      <div class="nav">
        <button id="prev" class="arrow" aria-label="Previous month">‹</button>
        <div class="mlabel"><h2 id="month"></h2><p class="status" id="status">&nbsp;</p></div>
        <button id="next" class="arrow" aria-label="Next month">›</button>
        <button class="today-btn" id="todayBtn">Today</button>
      </div>
      <div class="views" role="tablist" aria-label="View">
        <button id="vMonth" class="on" role="tab" aria-selected="true">Month</button>
        <button id="vAgenda" role="tab" aria-selected="false">Agenda</button>
      </div>
    </div>
  </header>

  <section class="strip">
    <div class="strip-in">
      <div class="next" id="next-up"><span class="lab">Loading schedule…</span></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <main>
    <div class="panel on" id="pMonth">
      <div class="wrap">
        <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="panel" id="pAgenda"><div class="wrap"><div class="agenda" id="agenda"></div></div></div>
  </main>
</div>

<div class="back" id="modal">
  <div class="box">
    <div class="hd"><h3 id="mTitle"></h3><button class="x" id="mX" aria-label="Close">✕</button></div>
    <div class="bdy" id="mBody"></div>
    <div class="ft"><button class="close" id="mClose">Close</button></div>
  </div>
</div>

  // ── State ──────────────────────────────────────────────────────────
  let DATA = {};                 // { "YYYY-MM-DD": [event, ...] }
  let cursor = new Date();       // month being displayed
  let view = window.innerWidth < 641 ? 'agenda' : 'month';
  let activeSports = null;       // null = show all
  let agendaScrolled = false;

  const $ = id => document.getElementById(id);
  const grid=$('grid'), agenda=$('agenda'), monthEl=$('month'), statusEl=$('status'),
        nextUp=$('next-up'), chips=$('chips'), modal=$('modal'),
        mTitle=$('mTitle'), mBody=$('mBody');

  const MONTHS = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];

  const pad = n => n < 10 ? '0'+n : ''+n;
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
  const TODAY = key(new Date());
  const longDate  = k => fromKey(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const shortDate = k => fromKey(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  // Events on a date, after sport filtering.
  function eventsOn(k){
    const list = DATA[k] || [];
    if (!activeSports || !activeSports.size) return list;
    return list.filter(e => activeSports.has(e.type || 'other'));
  }
  function datesWithEvents(){
    return Object.keys(DATA).filter(k => eventsOn(k).length).sort();
  }

  // ── Event card (agenda + modal) ────────────────────────────────────
  function card(ev, i){
    const m = meta(ev.type);
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--c', m.c);
    el.style.animationDelay = `${Math.min(i||0,8)*40}ms`;

    const ico = document.createElement('div');
    ico.className = 'ico'; ico.textContent = m.i;

    const bd = document.createElement('div'); bd.className = 'bd';
    const sp = document.createElement('div'); sp.className='sp'; sp.textContent = ev.sport || '';
    const mt = document.createElement('div'); mt.className='mt'; mt.textContent = ev.match || 'Game';
    const info = document.createElement('div'); info.className='meta';
    const add = (label,val) => {
      if(!val) return;
      const s=document.createElement('span'); const b=document.createElement('b');
      b.textContent=label+': '; s.appendChild(b); s.appendChild(document.createTextNode(val));
      info.appendChild(s);
    };
    add('Time', ev.time); add('Location', ev.loc); add('Official', ev.ref);

    bd.appendChild(sp); bd.appendChild(mt); bd.appendChild(info);
    if (ev.note){ const n=document.createElement('span'); n.className='note'; n.textContent=ev.note; bd.appendChild(n); }
    el.appendChild(ico); el.appendChild(bd);
    return el;
  }

  // ── Month grid ─────────────────────────────────────────────────────
  function renderMonth(){
    const y = cursor.getFullYear(), mo = cursor.getMonth();
    monthEl.textContent = `${MONTHS[mo]} ${y}`;
    monthEl.classList.remove('flip'); void monthEl.offsetWidth; monthEl.classList.add('flip');

    grid.innerHTML = '';
    const first = new Date(y,mo,1).getDay();
    const days  = new Date(y,mo+1,0).getDate();

    for(let i=0;i<first;i++){
      const c=document.createElement('div'); c.className='cell pad'; grid.appendChild(c);
    }
    for(let d=1; d<=days; d++){
      const k = `${y}-${pad(mo+1)}-${pad(d)}`;
      const evs = eventsOn(k);
      const c = document.createElement('div');
      c.className = 'cell' + (evs.length?' has':'') + (k===TODAY?' today':'');
      c.style.animationDelay = `${Math.min(d,20)*12}ms`;

      const num=document.createElement('div'); num.className='num'; num.textContent=d;
      c.appendChild(num);

      if(evs.length){
        const box=document.createElement('div'); box.className='pills';
        evs.slice(0,3).forEach(ev=>{
          const p=document.createElement('div'); p.className='pill';
          p.style.setProperty('--c', meta(ev.type).c);
          const t=(ev.time||'').replace(':00','').replace(' PM','p').replace(' AM','a');
          const s=(ev.sport||'').replace('Boys Varsity','B.Var').replace('Boys JV','B.JV')
                  .replace('Boys Jr. Varsity','B.JV').replace('Boys Jr.Varsity','B.JV')
                  .replace('Girls Varsity','G.Var').replace('Girls JV','G.JV')
                  .replace('Girls Jr. Varsity','G.JV');
          p.textContent = `${t} ${s}`.trim();
          box.appendChild(p);
        });
        if(evs.length>3){
          const more=document.createElement('div'); more.className='more';
          more.textContent=`+${evs.length-3} more`; box.appendChild(more);
        }
        c.appendChild(box);

        const dots=document.createElement('div'); dots.className='dots';
        evs.slice(0,4).forEach(ev=>{
          const i=document.createElement('i');
          i.style.setProperty('--c', meta(ev.type).c); dots.appendChild(i);
        });
        c.appendChild(dots);
        c.addEventListener('click',()=>openModal(k,evs));
      }
      grid.appendChild(c);
    }
  }

  // ── Agenda ─────────────────────────────────────────────────────────
  function renderAgenda(){
    agenda.innerHTML='';
    const keys = datesWithEvents();
    if(!keys.length){ agenda.appendChild(emptyState()); return; }

    let placed=false, divider=null, n=0;
    keys.forEach(k=>{
      if(!placed && k>=TODAY){
        divider=document.createElement('div'); divider.className='divider';
        divider.innerHTML='<span>Today</span>'; agenda.appendChild(divider); placed=true;
      }
      const g=document.createElement('div');
      g.className='grp'+(k<TODAY?' past':'');
      const h=document.createElement('h3'); h.textContent=longDate(k); g.appendChild(h);
      eventsOn(k).forEach(ev=>{ g.appendChild(card(ev,n)); n++; });
      agenda.appendChild(g);
    });

    if(!agendaScrolled){
      agendaScrolled=true;
      requestAnimationFrame(()=>{
        const t = divider || agenda.lastElementChild;
        if(t) agenda.scrollTop = Math.max(0, t.offsetTop-8);
      });
    }
  }

  function emptyState(){
    const d=document.createElement('div'); d.className='empty';
    const b=document.createElement('b');
    b.textContent = Object.keys(DATA).length ? 'No games match this filter'
                                             : 'Schedule unavailable';
    d.appendChild(b);
    d.appendChild(document.createTextNode(
      Object.keys(DATA).length
        ? 'Try turning a sport filter back on.'
        : "Couldn't load the schedule right now. It updates automatically a few times a day."
    ));
    if(!Object.keys(DATA).length){
      const r=document.createElement('button'); r.className='retry'; r.textContent='Try again';
      r.addEventListener('click',load); d.appendChild(document.createElement('br')); d.appendChild(r);
    }
    return d;
  }

  // ── Next-up banner ─────────────────────────────────────────────────
  function renderNext(){
    const keys = datesWithEvents();
    const k = keys.find(x => x >= TODAY);
    nextUp.innerHTML='';
    const lab=document.createElement('span'); lab.className='lab'; lab.textContent='Next up';
    if(!k){
      lab.textContent = keys.length ? 'No upcoming games scheduled' : 'No games loaded';
      nextUp.appendChild(lab); return;
    }
    const evs=eventsOn(k), ev=evs[0], extra = evs.length>1 ? ` (+${evs.length-1} more that day)` : '';
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=meta(ev.type).c;
    const m=document.createElement('span'); m.className='m'; m.textContent=ev.match||'Game';
    const d=document.createElement('span'); d.className='d';
    d.textContent = `${ev.sport||''}, ${k===TODAY?'Today':shortDate(k)}`
                  + (ev.time?` at ${ev.time}`:'') + (ev.loc?`, ${ev.loc}`:'') + extra;
    nextUp.append(lab,dot,m,d);
  }

  // ── Sport filter chips ─────────────────────────────────────────────
  function renderChips(){
    const present=[...new Set(Object.values(DATA).flat().map(e=>e.type||'other'))];
    chips.innerHTML='';
    if(present.length<2) return;         // no point filtering a single sport
    present.sort().forEach(t=>{
      const b=document.createElement('button');
      const on = !activeSports || activeSports.has(t);
      b.className='chip'+(on?' on':'')+(meta(t).c==='var(--red)'?' red':'');
      b.textContent=`${meta(t).i} ${meta(t).label}`;
      b.addEventListener('click',()=>{
        if(!activeSports) activeSports=new Set(present);
        activeSports.has(t) ? activeSports.delete(t) : activeSports.add(t);
        if(activeSports.size===present.length) activeSports=null;
        agendaScrolled=false; renderAll();
      });
      chips.appendChild(b);
    });
  }

  function renderAll(){ renderChips(); renderMonth(); renderAgenda(); renderNext(); }

  // ── Modal ──────────────────────────────────────────────────────────
  function openModal(k,evs){
    mTitle.textContent=longDate(k);
    mBody.innerHTML='';
    evs.forEach((e,i)=>mBody.appendChild(card(e,i)));
    modal.classList.add('on');
  }
  const closeModal=()=>modal.classList.remove('on');
  $('mX').addEventListener('click',closeModal);
  $('mClose').addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal.classList.contains('on')) closeModal(); });

  // ── Views + navigation ─────────────────────────────────────────────
  function setView(v){
    view=v; const isM = v==='month';
    $('pMonth').classList.toggle('on',isM);
    $('pAgenda').classList.toggle('on',!isM);
    $('vMonth').classList.toggle('on',isM);
    $('vAgenda').classList.toggle('on',!isM);
    $('vMonth').setAttribute('aria-selected',String(isM));
    $('vAgenda').setAttribute('aria-selected',String(!isM));
  }
  $('vMonth').addEventListener('click',()=>setView('month'));
  $('vAgenda').addEventListener('click',()=>setView('agenda'));
  $('prev').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()-1);renderMonth();});
  $('next').addEventListener('click',()=>{cursor.setMonth(cursor.getMonth()+1);renderMonth();});
  $('todayBtn').addEventListener('click',()=>{ cursor=new Date(); renderMonth(); });
  setView(view);

  // Open on the most useful month: the one holding the next upcoming
  // game, else the most recent month that has games, else today.
  function pickMonth(){
    const keys=datesWithEvents();
    if(!keys.length){ cursor=new Date(); return; }
    const upcoming = keys.find(k=>k>=TODAY);
    cursor = fromKey(upcoming || keys[keys.length-1]);
    cursor.setDate(1);
  }

  // ── Load ───────────────────────────────────────────────────────────
  function fmtWhen(iso){
    try{ return new Date(iso).toLocaleString('en-US',
      {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
    catch(e){ return null; }
  }

  async function load(){
    statusEl.textContent='Loading…';
    try{
      const res = await fetch(EVENTS_JSON_URL, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const evs = data && data.events;
      if(!evs || typeof evs!=='object') throw new Error('unexpected format');
      const count = Object.keys(evs).length;
      if(count === 0) throw new Error('feed contained no dates');
      DATA = evs;
      const when = fmtWhen(data.generated_at);
      statusEl.textContent = when ? `Updated ${when}` : 'Live schedule';
      statusEl.title = 'Loaded live from ' + EVENTS_JSON_URL;
    }catch(err){
      console.warn('Live schedule unavailable, using saved copy:', err);
      DATA = FALLBACK;
      const n = Object.keys(FALLBACK).length;
      statusEl.textContent = n ? 'Saved schedule' : 'Schedule unavailable';
      // Hovering the status shows the actual reason, which makes this
      // diagnosable without opening the browser console.
      statusEl.title = 'Could not load live schedule (' + (err && err.message ? err.message : err)
                     + '). Showing the copy saved with this page.';
    }
    agendaScrolled=false;
    pickMonth();
    renderAll();
  }

  load();
});
</script>
</body>
</html>
